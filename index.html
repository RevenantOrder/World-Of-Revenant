
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World of Revenant</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 0.5em;
        }
        p {
            font-size: 1.2em;
            max-width: 80%;
        }
        a.button {
            margin-top: 2em;
            background-color: #0ff;
            color: #000;
            padding: 0.8em 1.5em;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s ease;
        }
        a.button:hover {
            background-color: #08f;
        }
    </style>
</head>
<body>
    <h1>World of Revenant</h1>
    <p>Welcome to the shadow network.<br>Only the chosen walk this path.</p>
    <a href="register.html" class="button">Join The Order</a>
    <audio autoplay loop hidden>
        <source src="theme.mp3" type="audio/mpeg">
    </audio>
</body>
</html>
