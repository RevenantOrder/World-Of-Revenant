
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Registration</title>
    <style>
        body {
            background-color: #000;
            color: #0ff;
            font-family: 'Courier New', Courier, monospace;
            padding: 2em;
            text-align: center;
        }
        input, button {
            margin-top: 1em;
            padding: 1em;
            width: 80%;
            border: none;
            border-radius: 8px;
            font-size: 1em;
        }
        button {
            background-color: #0ff;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Join the Revenant Order</h2>
    <form action="https://formspree.io/f/your-form-id" method="POST">
        <input type="text" name="codename" placeholder="Codename" required><br>
        <input type="email" name="email" placeholder="Email" required><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
